<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard</title>

  <link rel="stylesheet" href="student dashboard.css"/>
</head>
<body>
  <!-- Back (top-left, oval) -->
  <button class="back-btn" id="backBtn">Back</button>
<main class="wrap">
    <h1 id="welcome" class="welcome">Welcome Student</h1>

    <section class="cards">
      <article class="card" id="coursesCard">
        <h2>📚 Courses</h2>
        <p>View course related videos.</p>
      </article>

      <article class="card" id="quizzesCard">
        <h2>📝 Quizzes</h2>
        <p>Take quizzes to test your knowledge.</p>
      </article>

      <article class="card" id="forumCard">
        <h2>💬 Discussion Forum</h2>
        <p> share ideas.</p>
      </article>
    </section>

    <button class="logout-btn" id="logoutBtn">Logout</button>
  </main>

 <script src="js/student dashboard.js"></script>

</body>
</html>
