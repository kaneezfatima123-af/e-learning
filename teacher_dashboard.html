<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>

  <link rel="stylesheet" href="teacher_dashboard.css">
</head>
<body>
  <!-- Back Button -->
  <button id="backBtn" class="back-btn">Back</button>

  <!-- Header -->
  <header>
    <h1>👩‍🏫 Teacher Dashboard</h1>
    <p>Manage courses, students and activities</p>
  </header>

  <!-- Dashboard Features -->
  <section class="dashboard">
    <div class="card">
      <h2>📘 Courses</h2>
      <p>Create & manage your courses.</p>
    </div>
    <div class="card">
      <h2>📝 Quizzes</h2>
      <p>Upload and manage quizzes.</p>
    </div>
    
    <div class="card">
      <h2>💬 Forum</h2>
      <p>Interact with students.</p>
    </div>
  </section>

  <!-- Footer with Logout -->
  <footer>
    <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
  </footer>

  <script src="js/teacher_dashboard.js"></script>

</body>
</html>
