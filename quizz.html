<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Quiz</title>
  <link rel="stylesheet" href="quizz.css">
</head>
<body>
  <!-- Back Button -->
  <button id="backBtn" class="back-btn">Back</button>

  <!-- Heading -->
  <h1 class="heading">Welcome to Quiz</h1>

  <!-- Quiz Form -->
  <form id="quizForm" class="quiz-container">
    <!-- Questions yahan JS se load honge -->
    <div id="quizContainer"></div>

    <!-- Submit Button -->
    <div class="submit-container">
      <button type="button" id="submitBtn" class="submit-btn">Submit</button>
    </div>
  </form>

  <!-- Result -->
  <div id="result" style="margin-top:20px; font-size:18px; font-weight:bold;"></div>

  <script src="js/quizz.js"></script>
</body>
</html>
