<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title><link rel="stylesheet" href="./assets/style.css"></head>
<body>
  <h2>Profile</h2>
  <pre id="me"></pre>
  <button id="logout">Logout</button>
  <script src="./assets/app.js"></script>
  <script>
    (async () => { const m = await api('/api/auth/me','GET',null,true); setMsg(m); })();
    document.getElementById('logout').onclick = ()=>{ localStorage.removeItem('token'); location.href='index.html'; };
  </script>
</body></html>
